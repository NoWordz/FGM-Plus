# 身份键（mod_id / mod_version / …）已上收仓库根 gradle.properties，
# 本文件只留平台自己的构建事实。读不到身份键时构建会直接失败（挂载脚本负责）。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.configuration-cache=false

minecraft_version=26.2
# 上游 FGM 5.0.0 对 26.2 段声明的验证范围是 [26.2,26.3)
minecraft_dependency=>=26.2 <26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_version=0.152.1+26.2

# Compile-time dependency: Female Gender Mod (via the Modrinth maven)
fgm_version=5.0.0+mc26.2-fabric

archives_base_name=fgmplus-fabric-26.2

# Run the Gradle wrapper with JDK 25 (JAVA_HOME or PATH).
# MC 26.x 原生 jar 无混淆：loom 跳过整个 mappings 体系（loom 源码 Constants.Properties.DISABLE_OBFUSCATION）
fabric.loom.disableObfuscation=true
